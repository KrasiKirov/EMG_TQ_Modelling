name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: EXPERIMENTS/requirements-handoff.txt
      - name: Install
        run: python -m pip install -r EXPERIMENTS/requirements-handoff.txt
      - name: Transferred artifacts present (paths and sizes)
        run: python EXPERIMENTS/code/verify_handoff.py --quick
