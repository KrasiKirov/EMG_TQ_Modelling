name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            EXPERIMENTS/requirements-handoff.txt
            EXPERIMENTS/requirements-dev.txt
      - name: Install
        run: python -m pip install -r EXPERIMENTS/requirements-handoff.txt -r EXPERIMENTS/requirements-dev.txt
      - name: Transferred artifacts present (paths and sizes)
        run: python EXPERIMENTS/code/verify_handoff.py --quick
      - name: Experiment pipeline tests
        run: python -m pytest -m "not slow"
      - name: Audited pipeline tests
        env:
          TF_CPP_MIN_LOG_LEVEL: '3'
        run: python -m unittest discover -s ML/tests -t .
