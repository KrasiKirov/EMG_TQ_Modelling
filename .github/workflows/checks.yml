name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: python -m pip install -r requirements-lock.txt
      - name: Transferred artifacts present (paths and sizes)
        run: python scripts/verify_handoff.py --quick
      - name: Tests (synthetic data only)
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: EXPERIMENTS/dashboard_react/package-lock.json
      - name: Dashboard typecheck
        working-directory: EXPERIMENTS/dashboard_react
        run: npm ci && npm run typecheck
