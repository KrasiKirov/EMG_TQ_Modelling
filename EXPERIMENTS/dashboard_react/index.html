<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231b1f27%27/%3E%3Cpath d=%27M5 19 L10 19 L13 9 L17 24 L20 14 L22 19 L27 19%27 fill=%27none%27 stroke=%27%23eb6834%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
    <title>EMG → ankle torque · results explorer</title>
    <script>
      // pick the colour scheme before first paint: URL hash theme=…, saved choice, else system
      (function () {
        var t = null;
        try {
          var m = /(?:^#|&)theme=(dark|light)(?:&|$)/.exec(location.hash);
          if (m) t = m[1];
        } catch (e) {}
        if (!t) {
          try {
            t = localStorage.getItem('emg-dash-theme');
          } catch (e) {}
        }
        if (t !== 'dark' && t !== 'light') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', t);
      })();
    </script>
    <style>
      html, body { margin: 0; background: #f4f5f7; }
      html[data-mantine-color-scheme='dark'], html[data-mantine-color-scheme='dark'] body { background: #16191f; }
      .boot { display: flex; align-items: center; justify-content: center; height: 100vh; font: 14px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #6b7079; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading results…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
